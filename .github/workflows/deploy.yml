name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare chatbot API URL
        id: chatbot_url
        env:
          RAW_URL: ${{ vars.VITE_CHATBOT_API_URL || secrets.VITE_CHATBOT_API_URL || 'https://serck-david-chatbot.serckdavid.workers.dev/api/chat' }}
        run: |
          CLEAN_URL=$(echo "$RAW_URL" | xargs)
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi
          if [[ ! "$CLEAN_URL" =~ /api/chat$ ]]; then
            CLEAN_URL="${CLEAN_URL%/}/api/chat"
          fi
          echo "url=$CLEAN_URL" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: npm run build
        env:
          VITE_BASE_PATH: '/serck-david-portfolio/'
          VITE_CHATBOT_API_URL: ${{ steps.chatbot_url.outputs.url }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
